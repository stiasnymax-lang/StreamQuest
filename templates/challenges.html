{% extends "base.html" %}

{% block title %}Challenges{% endblock %}

{% block content %}
<h1>Alle Challenges</h1>

<form method="get">
    {{ form.c(placeholder="Search challenges") }}
    {{ form.submit() }}
</form>

<ul>
    {% for challenge in challenges %}
    <li>
        <a href="{{ url_for('challenge', challenge_id=challenge.id) }}">
            {{ challenge.title }} ({{ challenge.game_name }})
        </a>
    </li>
    {% endfor %}
</ul>
{% endblock %}
