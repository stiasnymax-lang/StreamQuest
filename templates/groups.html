{% extends "base.html" %}

{% block title %}Gruppen{% endblock %}

{% block content %}
<h1>Alle Gruppen</h1>

<form method="get">
    {{ form.g(placeholder="Search group to join") }}
    {{ form.submit() }}
</form>

<ul>
    {% for group in groups %}
    <li>
        <a href="{{ url_for('group', group_id=group.id) }}">
            {{ group.name }} (Members: {{ group.member_count + 1 }})
        </a>
    </li>
    {% endfor %}
</ul>
{% endblock %}
